name: Test and Deploy Nook to Janus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Test & Validate
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://nook_user:NookSecretPass2026@localhost:5432/nook_db' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: npm run build --workspace=@nook/shared

      - name: Run Unit & Integration Tests
        run: npm run test

      - name: Lint OpenAPI Schema with Spectral
        run: npm run lint:spectral

  deploy:
    name: Trigger Coolify Redeploy
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - name: Trigger Coolify Deployment
        env:
          COOLIFY_HOST: ${{ secrets.COOLIFY_HOST }}
          COOLIFY_UUID: ${{ secrets.COOLIFY_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          # 1. Check for dedicated Webhook URL first
          if [ -n "${COOLIFY_WEBHOOK_URL}" ]; then
            echo "🚀 Triggering deployment via Coolify Webhook URL..."
            curl -s -f -X GET "${COOLIFY_WEBHOOK_URL}" || curl -s -f -X POST "${COOLIFY_WEBHOOK_URL}"
            echo "✅ Deployment webhook triggered successfully!"
            exit 0
          fi

          # 2. Resolve token from server local file (~/.coolify_token) or GitHub secret
          TOKEN=""
          if [ -f "$HOME/.coolify_token" ]; then
            TOKEN=$(tr -d '\r\n ' < "$HOME/.coolify_token")
          elif [ -f "/home/daniel/.coolify_token" ]; then
            TOKEN=$(tr -d '\r\n ' < "/home/daniel/.coolify_token")
          elif [ -n "${COOLIFY_TOKEN}" ]; then
            TOKEN="${COOLIFY_TOKEN}"
          fi

          if [ -z "$TOKEN" ]; then
            echo "❌ Error: Coolify API Token not found in ~/.coolify_token or GitHub secret COOLIFY_TOKEN!"
            exit 1
          fi

          # 3. Host (defaults to local Coolify instance)
          HOST="${COOLIFY_HOST:-http://localhost:8000}"

          # 4. Nook Application UUID
          UUID="${COOLIFY_UUID:-ll4zn09zwlo9rlo1wm9gdkcl}"

          echo "🚀 Quality gates passed. Triggering deployment on Janus (${HOST}) for UUID ${UUID}..."
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 30 -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            "${HOST}/api/v1/deploy?uuid=${UUID}&force=false")

          HTTP_STATUS=$(echo "${RESPONSE}" | tail -n1)
          BODY=$(echo "${RESPONSE}" | sed '$d')

          echo "Response Body: ${BODY}"
          echo "HTTP Status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -eq 200 ] || [ "${HTTP_STATUS}" -eq 201 ]; then
            echo "✅ Deployment successfully queued on Project Janus Coolify engine!"
          else
            echo "❌ Coolify deployment trigger failed with HTTP ${HTTP_STATUS}"
            exit 1
          fi
